<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - TITAN Convective Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background: #0f172a; font-family: sans-serif; }
        .info-panel { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.9); color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 11px; max-width: 260px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .cell-img { width: 100%; border-radius: 4px; margin-top: 6px; border: 1px solid #475569; }
        .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border-radius: 8px; }
        .leaflet-popup-tip { background: #1e293b; }
    </style>
</head>
<body>
    <div class="info-panel">
        <b>TITAN Convective Tracker</b><br>
        Radar Reale & Vettori 3h<br>
        <span id="status-radar" style="color: #38bdf8;">Connessione radar...</span>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione mappa centrata sull'Italia
        var map = L.map('map').setView([41.9, 12.5], 6);

        // Mappa base OpenStreetMap
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Layer Satellite IR Trasparente gratuito da EUMETSAT WMS (EUMETView)
        var eumetsatIR = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
            layers: 'msg_fes:rgb_airmass',
            format: 'image/png',
            transparent: true,
            attribution: '&copy; EUMETSAT',
            opacity: 0.5
        });

        // Layer radar in semitrasparenza tramite API aperte RainViewer
        var radarLayer = L.tileLayer('', { opacity: 0.6, attribution: 'RainViewer' });

        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(response => response.json())
            .then(data => {
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    let latestPath = data.radar.past[data.radar.past.length - 1].path;
                    radarLayer.setUrl(`https://tile.rainviewer.com${latestPath}/256/{z}/{x}/{y}/2/1_1.png`);
                    radarLayer.addTo(map);
                    document.getElementById('status-radar').innerText = "Radar attivo e sincronizzato";
                }
            })
            .catch(err => {
                console.error("Errore radar:", err);
                document.getElementById('status-radar').innerText = "Errore flusso radar";
            });

        // Controllo Layer per attivare/disattivare OSM, Radar e Satellite IR EUMETSAT
        var baseMaps = { "OpenStreetMap": osmLayer };
        var overlayMaps = {
            "Radar RainViewer": radarLayer,
            "Satellite IR (EUMETSAT)": eumetsatIR
        };
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Caricamento dati celle da cells.json generato dal backend
        fetch('cells.json')
            .then(response => response.json())
            .then(cells => {
                cells.forEach(cell => {
                    let color = cell.max_dbz >= 55 ? '#e11d48' : '#f59e0b';
                    let iconHtml = `<div style="background:${color}; width:16px; height:16px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 10px ${color};"></div>`;
                    let centroidIcon = L.divIcon({ html: iconHtml, className: 'custom-centroid', iconSize: [16, 16] });

                    let marker = L.marker([cell.lat, cell.lon], {icon: centroidIcon}).addTo(map);

                    let popupContent = `
                        <div style="font-size:12px; line-height: 1.4;">
                            <b style="color:#38bdf8;">Cell ID: ${cell.id}</b><br>
                            <b>Max dBZ:</b> ${cell.max_dbz}<br>
                            <b>Velocità:</b> ${cell.velocita}<br>
                            <b>Severità:</b> ${cell.gravita}<br>
                            <b>Rischio Grandine:</b> ${cell.rischio_grandine}<br>
                            <b>VCM / VIL:</b> ${cell.cattivo}<br>
                            <i style="color:#cbd5e1;">${cell.eta}</i><br>
                            <img src="${cell.percorso_immagine}" class="cell-img" alt="3D Volumetrico">
                        </div>
                    `;
                    marker.bindPopup(popupContent);

                    // Vettore Storico (Tratteggiato blu)
                    if (cell.percorso_storico && cell.percorso_storico.length > 0) {
                        L.polyline(cell.percorso_storico, {color: '#38bdf8', weight: 3, dashArray: '6, 6'}).addTo(map);
                    }

                    // Vettore Predittivo a 3 ore (Continuo rosso)
                    if (cell.percorso_previsione && cell.percorso_previsione.length > 0) {
                        L.polyline(cell.percorso_previsione, {color: '#ef4444', weight: 4}).addTo(map);
                    }

                    // Anello CEP
                    if (cell.anello_cep) {
                        L.circle([cell.anello_cep.lat, cell.anello_cep.lon], {
                            radius: cell.anello_cep.raggio_m,
                            color: '#f97316',
                            fillColor: '#f97316',
                            fillOpacity: 0.15,
                            weight: 1.5
                        }).addTo(map);
                    }
                });
            })
            .catch(err => console.error("Errore caricamento celle:", err));
    </script>
</body>
</html>
