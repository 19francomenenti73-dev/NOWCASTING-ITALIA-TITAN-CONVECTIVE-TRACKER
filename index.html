<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia — TITAN LAGRANGIAN CONVECTIVE TRACKER</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .tracker-header {
            position: absolute;
            top: 10px;
            left: 60px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border-left: 4px solid #28a745;
        }
        .pulsing-centroid {
            background: rgba(40, 167, 69, 0.8);
            border: 3px solid #ffffff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
        .leaflet-popup-content-wrapper {
            background: #ffffff;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .radar-modal-content {
            text-align: center;
            max-width: 260px;
        }
        .radar-modal-content img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
            background: #fff;
            display: block;
        }
        .radar-data {
            font-size: 12px;
            text-align: left;
            line-height: 1.4;
            color: #333;
        }
        .radar-data span {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="tracker-header">NOWCASTING ITALIA — TITAN LAGRANGIAN CONVECTIVE TRACKER</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inizializzazione della mappa centrata sull'Italia
        const map = L.map('map', {
            center: [42.0, 12.5],
            zoom: 6,
            minZoom: 5,
            maxZoom: 18,
            maxBounds: [[34.0, 5.0], [48.0, 20.0]]
        });

        // 2. Mappa di base OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Layer Satellitare Infrarosso EUMETSAT RSS in semi-trasparenza (attivo 24/7)
        const eumetsatSatLayer = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
            layers: 'msg_rss:ir108',
            format: 'image/png',
            transparent: true,
            opacity: 0.5,
            version: '1.1.1',
            attribution: '&copy; EUMETSAT EUMETView RSS'
        }).addTo(map);

        // 4. Caricamento del livello Radar in tempo reale da RainViewer
        async function loadRadarLayer() {
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                const host = data.host || 'https://tilecache.rainviewer.com';

                if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
                    const latestRadar = data.radar.past[data.radar.past.length - 1];
                    L.tileLayer(host + latestRadar.path + '/256/{z}/{x}/{y}/2/1_1.png', {
                        tileSize: 256,
                        opacity: 0.75,
                        attribution: '&copy; RainViewer Radar'
                    }).addTo(map);
                }
            } catch (e) {
                console.error("Errore nel caricamento del layer radar:", e);
            }
        }

        loadRadarLayer();

        // 5. Caricamento delle celle leggendo correttamente le chiavi in italiano dal file cells.json
        async function loadStormData() {
            try {
                const response = await fetch('cells.json?t=' + new Date().getTime());
                const cells = await response.json();

                cells.forEach(cell => {
                    if (cell.lat && cell.lon) {
                        
                        // Vettore Storico (Blu)
                        if (cell.percorso_storico && cell.percorso_storico.length > 0) {
                            L.polyline(cell.percorso_storico, { color: '#007bff', weight: 4, opacity: 0.8 }).addTo(map);
                        }
                        
                        // Vettore Previsionale (Rosso Tratteggiato)
                        if (cell.percorso_previsione && cell.percorso_previsione.length > 0) {
                            L.polyline(cell.percorso_previsione, { color: '#dc3545', weight: 3, dashArray: '5, 10', opacity: 0.9 }).addTo(map);
                        }
                        
                        // Anello CEP
                        if (cell.anello_cep && cell.anello_cep.lat && cell.anello_cep.lon) {
                            L.circle([cell.anello_cep.lat, cell.anello_cep.lon], {
                                color: '#dc3545', fillColor: '#dc3545', fillOpacity: 0.15,
                                radius: cell.anello_cep.raggio_m || 5000, weight: 2
                            }).addTo(map);
                        }

                        // Centroide Pulsante Verde
                        const pulsingIcon = L.divIcon({
                            className: 'pulsing-centroid',
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        });
                        const marker = L.marker([cell.lat, cell.lon], { icon: pulsingIcon }).addTo(map);

                        // Estrazione sicura dei dati basata sulle chiavi in italiano del JSON
                        const maxDbz = cell.max_dbz !== undefined ? cell.max_dbz : '-';
                        const velocity = cell.velocità !== undefined ? cell.velocità : '-';
                        const gravity = cell.gravità !== undefined ? cell.gravità : '-';
                        const hailRisk = cell["rischio grandine"] !== undefined ? cell["rischio grandine"] : '-';
                        const vil = cell.cattivo !== undefined ? cell.cattivo : '-';
                        const eta = cell.eta !== undefined ? cell.eta : '-';
                        const imagePath = cell.percorso_immagine ? cell.percorso_immagine : '';

                        // Popup con Immagine Volumetrica 3D e dati formattati
                        const popupContent = `
                            <div class="radar-modal-content">
                                ${imagePath ? `<img src="${imagePath}" alt="Estrusione Radar 3D">` : ''}
                                <div class="radar-data">
                                    <div>ID Cella: <span>${cell.id || 'N/D'}</span></div>
                                    <div>Riflettività Max: <span>${maxDbz} dBZ</span></div>
                                    <div>Velocità: <span>${velocity}</span></div>
                                    <div>Gravità: <span>${gravity}</span></div>
                                    <div>Grandine: <span>${hailRisk}</span></div>
                                    <div>VIL / Altro: <span>${vil}</span> | ETA: <span>${eta}</span></div>
                                </div>
                            </div>
                        `;
                        marker.bindPopup(popupContent);
                    }
                });
            } catch (error) {
                console.error("Errore nel caricamento dei dati delle celle:", error);
            }
        }

        loadStormData();
        setInterval(loadStormData, 600000);
    </script>
</body>
</html>
