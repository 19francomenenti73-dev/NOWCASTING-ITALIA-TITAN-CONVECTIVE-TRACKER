name: Aggiornamento del motore lagrangiano TITAN (10 minuti)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy matplotlib

      - name: Esecuzione Script Python (Generazione Griglia e JSON)
        run: python generate_grid.py

      - name: Commit e Push automatico sicuro
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Aggiornamento automatico grigliato 3D e celle (cella 01)'
          file_pattern: 'immagini/cell_sample_01.png cells.json'
          
