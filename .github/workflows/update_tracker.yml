name: Aggiornamento del nowcast lagrangiano TITAN

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tracciamento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installare le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow

      - name: Esecuzione Script Python (Griglie e JSON)
        run: python generate_grid.py

      - name: Conferma e invio modifiche automatiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cells.json immagini/
          git commit -m "Aggiornamento automatico celle radar e grafica 3D [skip ci]" || exit 0
          git push
          
