name: Aggiornamento Tracker e Celle Radar

on:
  schedule:
    - cron: '*/30 * * * *' # Esegue ogni 30 minuti
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install Pillow

      - name: Esegui generatore celle
        run: python generate_grid.py

      - name: Commit e Push dei cambiamenti
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cells.json immagini/
          git commit -m "Aggiornamento automatico celle radar e grafici 3D [skip ci]" || exit 0
          git push
          
