name: Aggiornamento del motore lagrangiano TITAN (10 minuti)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-tracker-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow scipy

      - name: Esecuzione Script Python (Crea/Aggiorna Griglia e JSON)
        run: python generate_grid.py

      - name: Commit and Push automatic changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add cells.json images/
          git commit -m "Aggiornamento automatico celle radar e grafica 3D" || exit 0
          git push
          
