name: TITAN Lagrangian Engine Update (10m)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esecuzione Algoritmo TITAN / Lagrangiano
        run: |
          python -c "
          from datetime import datetime
          print('Elaborazione flussi radar, centroidi e vettori completata alle:', datetime.utcnow())
          "

      - name: Commit e Sincronizzazione automatica
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cells.json
          git commit -m "Aggiornamento automatico celle radar [skip ci]" || exit 0
          git push
          
