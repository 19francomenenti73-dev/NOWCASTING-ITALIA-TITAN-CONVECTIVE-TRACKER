name: TITAN Lagrangian Engine Update (10m)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Esecuzione Algoritmo TITAN e Generazione Immagini
        run: |
          python generate_grid.py

      - name: Commit e Sincronizzazione automatica
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add images/cell_sample_01.png cells.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico griglia radar 3D e celle [skip ci]"
          git push
          
